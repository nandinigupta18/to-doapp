<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Elegant & Powerful Task Manager</title>
  <meta name="description"
    content="Stay organized, focused, and productive with TaskFlow. A modern, lightning-fast to-do application with priority tags, categories, and progress tracking.">
  <meta name="theme-color" content="#0f172a">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Ambient background lighting -->
  <div class="ambient-glow glow-1" aria-hidden="true"></div>
  <div class="ambient-glow glow-2" aria-hidden="true"></div>
  <div class="ambient-glow glow-3" aria-hidden="true"></div>

  <!-- Confetti Canvas for celebration -->
  <canvas id="confetti-canvas" class="confetti-canvas" aria-hidden="true"></canvas>

  <div class="app-wrapper">
    <!-- Header Section -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
        </div>
        <div class="brand-text">
          <h1>TaskFlow</h1>
          <p class="brand-subtitle" id="current-date">Loading date...</p>
        </div>
      </div>

      <div class="header-actions">
        <button id="theme-toggle" class="icon-button" title="Toggle Theme" aria-label="Toggle Theme">
          <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Progress & Overview Widget -->
    <section class="progress-section" aria-label="Task Progress">
      <div class="progress-card">
        <div class="progress-info">
          <div>
            <span class="progress-badge">Daily Velocity</span>
            <h2 class="progress-title" id="progress-heading">Ready to conquer your goals?</h2>
            <p class="progress-subtitle" id="progress-stats-text">0 of 0 tasks completed</p>
          </div>
          <div class="progress-percentage-wrapper">
            <span class="progress-percentage" id="progress-percentage">0%</span>
          </div>
        </div>

        <div class="progress-bar-container" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"
          id="progress-bar-wrapper">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
      </div>
    </section>

    <!-- Add Task Card -->
    <section class="add-task-section" aria-label="Create New Task">
      <form id="add-task-form" class="task-form">
        <div class="input-main-row">
          <div class="input-icon-wrapper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="16"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
          </div>
          <input type="text" id="task-title-input" class="task-input"
            placeholder="What would you like to achieve today?..." autocomplete="off" maxlength="140" required
            aria-label="New task title" />
          <button type="submit" id="add-task-btn" class="btn-primary" aria-label="Add task button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Add Task</span>
          </button>
        </div>

        <!-- Task Metadata controls (Priority, Category, Due date) -->
        <div class="form-metadata-row">
          <div class="meta-field">
            <label for="task-priority-select">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon
                  points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
                </polygon>
              </svg>
              Priority
            </label>
            <div class="select-wrapper">
              <select id="task-priority-select" class="form-select" aria-label="Task priority">
                <option value="medium" selected>⚡ Medium Priority</option>
                <option value="high">🔥 High Priority</option>
                <option value="low">🌱 Low Priority</option>
              </select>
            </div>
          </div>

          <div class="meta-field">
            <label for="task-category-select">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
              Category
            </label>
            <div class="select-wrapper">
              <select id="task-category-select" class="form-select" aria-label="Task category">
                <option value="Work">💼 Work</option>
                <option value="Personal" selected>👤 Personal</option>
                <option value="Study">📚 Study</option>
                <option value="Health">🧘 Health</option>
                <option value="Finance">💳 Finance</option>
              </select>
            </div>
          </div>

          <div class="meta-field">
            <label for="task-due-date">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              Due Date
            </label>
            <input type="date" id="task-due-date" class="form-date-input" aria-label="Task due date" />
          </div>
        </div>
      </form>
    </section>

    <!-- Toolbar: Search, Filters & Sorting -->
    <section class="toolbar-section">
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search your tasks... (Press / to focus)"
          aria-label="Search tasks" />
        <button id="clear-search-btn" class="clear-search-btn" title="Clear search" aria-label="Clear search"
          style="display: none;">
          ✕
        </button>
      </div>

      <div class="filter-sort-controls">
        <div class="filter-tabs" role="tablist" aria-label="Task filters">
          <button class="filter-tab active" data-filter="all" role="tab" aria-selected="true" id="filter-all">
            All <span class="tab-count" id="count-all">0</span>
          </button>
          <button class="filter-tab" data-filter="active" role="tab" aria-selected="false" id="filter-active">
            Active <span class="tab-count" id="count-active">0</span>
          </button>
          <button class="filter-tab" data-filter="completed" role="tab" aria-selected="false" id="filter-completed">
            Done <span class="tab-count" id="count-completed">0</span>
          </button>
          <button class="filter-tab" data-filter="starred" role="tab" aria-selected="false" id="filter-starred">
            Starred <span class="tab-count" id="count-starred">0</span>
          </button>
        </div>

        <div class="sort-wrapper">
          <label for="sort-select" class="sr-only">Sort Tasks</label>
          <select id="sort-select" class="sort-select" aria-label="Sort tasks">
            <option value="created-desc">🕒 Newest first</option>
            <option value="created-asc">⏳ Oldest first</option>
            <option value="priority-desc">🔥 Priority: High to Low</option>
            <option value="due-date">📅 Due Date</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Tasks List Container -->
    <main class="tasks-container" id="tasks-container">
      <ul class="task-list" id="task-list" aria-label="Tasks List">
        <!-- Rendered dynamically by app.js -->
      </ul>

      <!-- Empty State -->
      <div class="empty-state" id="empty-state" style="display: none;">
        <div class="empty-illustration">
          <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
        </div>
        <h3 class="empty-title" id="empty-title">All caught up!</h3>
        <p class="empty-desc" id="empty-desc">No tasks match your current view. Enjoy your day or add something new
          above.</p>
      </div>
    </main>

    <!-- Footer & Quick Actions -->
    <footer class="app-footer">
      <div class="footer-stats">
        <span id="footer-tasks-count">0 tasks remaining</span>
      </div>

      <div class="footer-actions">
        <button id="clear-completed-btn" class="footer-btn text-muted-btn" title="Remove finished tasks">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Clear Completed
        </button>
        <button id="reset-sample-btn" class="footer-btn text-muted-btn" title="Load sample tasks">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          Load Demo
        </button>
      </div>
    </footer>

    <!-- Keyboard Shortcuts Banner -->
    <aside class="shortcuts-helper">
      <span class="shortcut-tip"><kbd>Enter</kbd> Add Task</span>
      <span class="shortcut-tip"><kbd>/</kbd> Quick Search</span>
      <span class="shortcut-tip"><kbd>Esc</kbd> Clear Search</span>
    </aside>
  </div>

  <!-- Edit Task Modal -->
  <dialog id="edit-modal" class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Edit Task</h3>
        <button id="close-modal-btn" class="icon-button modal-close" aria-label="Close modal">✕</button>
      </div>
      <form id="edit-form" class="edit-form">
        <input type="hidden" id="edit-task-id" />
        <div class="edit-field">
          <label for="edit-title-input">Task Title</label>
          <input type="text" id="edit-title-input" class="task-input" required maxlength="140" />
        </div>
        <div class="edit-grid">
          <div class="edit-field">
            <label for="edit-priority-select">Priority</label>
            <select id="edit-priority-select" class="form-select">
              <option value="high">🔥 High</option>
              <option value="medium">⚡ Medium</option>
              <option value="low">🌱 Low</option>
            </select>
          </div>
          <div class="edit-field">
            <label for="edit-category-select">Category</label>
            <select id="edit-category-select" class="form-select">
              <option value="Work">💼 Work</option>
              <option value="Personal">👤 Personal</option>
              <option value="Study">📚 Study</option>
              <option value="Health">🧘 Health</option>
              <option value="Finance">💳 Finance</option>
            </select>
          </div>
          <div class="edit-field">
            <label for="edit-due-date">Due Date</label>
            <input type="date" id="edit-due-date" class="form-date-input" />
          </div>
        </div>
        <div class="modal-buttons">
          <button type="button" id="cancel-edit-btn" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Notification Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="app.js"></script>
</body>

</html>
